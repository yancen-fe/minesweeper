# Only Minesweeper release paths are changed
location ^~ /minesweeper/releases/ {
    types { application/x-apple-diskimage dmg; application/zip zip; application/vnd.microsoft.portable-executable exe; text/plain sig; }
    add_header Content-Disposition attachment;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
location ~ ^/minesweeper/(version|downloads|latest|stable-latest|release-history|update-tag)\.json$ {
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
location = /minesweeper/appcast.xml {
    default_type application/xml;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# Local browser image previews are data URLs; no external image hosts are allowed.
location ~ ^/minesweeper/(play|web-[0-9]+\.[0-9]+\.[0-9]+)/ {
    add_header Cache-Control no-cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ =404;
}
